name: Pebble
options:
  bundleIdPrefix: com.pebble
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: Pebble/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Pebble:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Pebble
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pebble.storagecleaner
        PRODUCT_NAME: Pebble
        INFOPLIST_FILE: Pebble/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: targeted
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    info:
      path: Pebble/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: Pebble
        NSPhotoLibraryUsageDescription: "Pebble scans your photo library locally to find duplicates, similar shots, and screenshots you can safely clean up. Your photos never leave this device."
        NSContactsUsageDescription: "Pebble checks your contacts locally to find and merge duplicate entries. Your contacts stay private and on-device."
